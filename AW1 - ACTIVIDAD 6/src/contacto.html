<body>
    <header class="encabezado-principal">
        <a href="./index.html" aria-label="Ir al Inicio">
            <img src="recursos/imagenes/Perfil.webp" alt="Perfil de la pagina">

            <a href="./index.html">Inicio</a>
            <a href="./contacto.html">Contacto</a>

        <h1>Contacto</h1>
    </header>

    <main class="contenido-principal">
        <h2>¿Querés llevar tu negocio al siguiente nivel digital? Completá el siguiente formulario con tus datos y contame brevemente sobre tu proyecto. Me pondré en contacto con vos dentro de las próximas 24 horas hábiles.</h2>
        
        <form action="./contacto.html" method="post">
            <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre"> 

            <label for="id-telefono">Teléfono</label>
            <input type="tel" name="telefono" id="id-telefono">

            <label for="id-correo">Correo Electrónico</label>
            <input type="email" name="correo" id="id-correo">

            <label for="id-rubro_negocio">Rubro o tipo de negocio</label>
            <input type="text" name="rubro_negocio" id="id-rubro_negocio">

            <label for="id-comentario">Consultar</label>
            <textarea name="comentario" id="id-comentario"></textarea>
            
            <button type="reset">Limpiar</button>
            <button type="submit">Enviar</button>
        </form>

        <h2>Dónde estamos</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d229929.2133779566!2d-80.39020462891557!3d25.78232116205203!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88d9b0a20ec8c111%3A0xff96f271ddad4f65!2sMiami%2C%20Florida%2C%20EE.%20UU.!5e0!3m2!1ses!2sar!4v1788358980512!5m2!1ses!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </main>

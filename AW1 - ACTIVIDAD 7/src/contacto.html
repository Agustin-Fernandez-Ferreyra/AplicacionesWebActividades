<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Martín Herrera</title>
    <link rel="stylesheet" href="./recursos/imagenes/index.css">
</head>
<body>
    <header class="cabecera-principal">
        <h1>Contacto</h1>
        <nav>
            <a href="./index.html">Inicio</a>
            <a href="./contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="contenido-principal">
        <section>
            <h2>Contactame</h2>
            <p>
                Gracias por tu interés en mi trabajo. Para poder conocer mejor tu proyecto y preparar una respuesta adecuada, completá el formulario con tus datos y una breve descripción del servicio que necesitás.
            </p>

            <form>
                <p>
                    <label for="nombre">Nombre y apellido:</label>
                    <input type="text" id="nombre" name="nombre">
                </p>

                <p>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email">
                </p>

                <p>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </p>

                <p>
                    <label for="servicio">Tipo de servicio:</label>
                    <select id="servicio" name="servicio">
                        <option value="retratos">Retratos profesionales</option>
                        <option value="emprendedores">Fotografía para emprendedores y marcas</option>
                        <option value="corporativa">Fotografía corporativa</option>
                        <option value="eventos">Cobertura de eventos</option>
                        <option value="familiar">Sesión personal o familiar</option>
                        <option value="otro">Otro</option>
                    </select>
                </p>

                <p>
                    <label for="fecha">Fecha estimada:</label>
                    <input type="date" id="fecha" name="fecha">
                </p>

                <p>
                    <label for="lugar">Lugar o localidad:</label>
                    <input type="text" id="lugar" name="lugar">
                </p>

                <p>
                    <label for="personas">Cantidad aproximada de personas:</label>
                    <input type="number" id="personas" name="personas" min="1">
                </p>

                <p>
                    <label for="consulta">Descripción de la consulta:</label>
                    <textarea id="consulta" name="consulta" rows="6" cols="40" required></textarea>
                </p>

                <p>Forma de contacto preferida:</p>

                <p>
                    <input type="radio" id="contacto-email" name="contacto" value="email">
                    <label for="contacto-email">Correo electrónico</label>

                    <input type="radio" id="contacto-telefono" name="contacto" value="telefono">
                    <label for="contacto-telefono">Teléfono</label>
                </p>

                <p>
                    <input type="checkbox" id="aceptacion" name="aceptacion" required>
                    <label for="aceptacion">
                        Acepto enviar mis datos de contacto.
                    </label>
                </p>

                <p>
                    <input type="submit" value="Enviar consulta">
                </p>
            </form>
        </section>
    </main>
</body>
</html>
